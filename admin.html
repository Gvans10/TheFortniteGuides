<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Grayson's Snack Shop Admin
</title>


<link
    rel="icon"
    type="image/png"
    href="graysonslogos.png"
>


<link
    rel="stylesheet"
    href="style.css"
>


<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>


<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>


<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

</head>



<body>


<header>

<nav class="navbar">


<div class="logo">

🍬 Admin Panel

</div>



<a href="index.html">

Back To Shop

</a>


</nav>

</header>





<section class="admin-section">



<!-- =====================================================
     LOGIN
===================================================== -->


<div
    id="loginBox"
    class="admin-box"
>


<h1>
Admin Login
</h1>


<p>
Owner Access Only
</p>



<input
    id="username"
    type="email"
    placeholder="Admin Email"
    autocomplete="email"
>



<input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
>



<button id="loginButton">

Login

</button>



<p id="loginMessage"></p>


</div>





<!-- =====================================================
     DASHBOARD
===================================================== -->


<div
    id="dashboard"
    class="admin-box hidden"
>



<h1>
Inventory Dashboard
</h1>



<p id="adminWelcome">
Admin Dashboard
</p>





<!-- =====================================================
     PROMOTION CONTROL
===================================================== -->


<div class="admin-section-card">


<h2>
🎉 Promotion Control
</h2>


<p>
Control your active promotion from here.
</p>



<label>
Promotion Name
</label>


<input
    id="promotionName"
    placeholder="Promotion Name"
>



<label>
Description
</label>


<textarea
    id="promotionDescription"
    placeholder="Promotion description"
    rows="4"
></textarea>



<label class="checkbox-label">


<input
    id="promotionActive"
    type="checkbox"
>


<span>
Promotion Active
</span>


</label>



<label>
Start Date & Time
</label>


<input
    id="promotionStart"
    type="datetime-local"
>



<label>
End Date & Time
</label>


<input
    id="promotionEnd"
    type="datetime-local"
>



<label>
Qualifying Product
</label>


<select
    id="qualifyingProduct"
>

<option value="">
Select Product
</option>

</select>



<label>
Reward Product
</label>


<select
    id="rewardProduct"
>

<option value="">
Select Product
</option>

</select>



<label>
Reward Quantity
</label>


<input
    id="rewardQuantity"
    type="number"
    min="1"
    value="1"
>



<button
    id="savePromotion"
>

Save Promotion

</button>



<p id="promotionMessage"></p>


</div>





<!-- =====================================================
     ADD PRODUCT
===================================================== -->


<h2>
Add New Product
</h2>



<input
    id="newName"
    placeholder="Product Name"
>



<input
    id="newPrice"
    type="number"
    step="0.01"
    min="0"
    placeholder="Price"
>



<input
    id="newStock"
    type="number"
    min="0"
    placeholder="Stock Amount"
>



<input
    id="newRestock"
    placeholder="Restock Date"
>



<input
    id="newImage"
    placeholder="Image Filename (example: chips.png)"
>



<button id="addProduct">

Add Product

</button>





<!-- =====================================================
     CURRENT PRODUCTS
===================================================== -->


<h2>
Current Products
</h2>



<div id="adminProducts"></div>





<!-- =====================================================
     LOGOUT
===================================================== -->


<button id="logout">

Logout

</button>


</div>


</section>





<script
    type="module"
    src="admin.js"
></script>


</body>

</html>
