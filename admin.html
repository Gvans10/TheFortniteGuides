<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Grayson's Snack Shop Admin
    </title>

    <link
        rel="icon"
        type="image/png"
        href="graysonslogos.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- ======================================================
     NAVBAR
====================================================== -->

<header>

    <nav class="navbar">

        <div class="logo">

            🍬 Grayson's Snack Shop Admin

        </div>


        <a href="index.html">

            Back To Shop

        </a>

    </nav>

</header>



<!-- ======================================================
     ADMIN SECTION
====================================================== -->

<section class="admin-section">


    <!-- ==================================================
         LOGIN
    =================================================== -->

    <div
        id="loginBox"
        class="admin-box"
    >

        <h1>
            Admin Login
        </h1>


        <p>
            Owner Access Only
        </p>


        <input
            id="username"
            type="email"
            placeholder="Admin Email"
            autocomplete="email"
        >


        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button id="loginButton">

            Login

        </button>


        <p id="loginMessage"></p>

    </div>



    <!-- ==================================================
         DASHBOARD
    =================================================== -->

    <div
        id="dashboard"
        class="admin-box hidden"
    >


        <h1>
            Inventory Dashboard
        </h1>


        <p>
            Manage your snacks, inventory, and promotions.
        </p>



        <!-- ==============================================
             PROMOTION
        =============================================== -->

        <h2>
            Promotion Event
        </h2>


        <p>
            Create and manage your current promotion.
        </p>


        <label>
            Promotion Name
        </label>

        <input
            id="promotionName"
            type="text"
            placeholder="Example: Bring a Friend"
        >



        <label>

            Promotion Active

        </label>

        <input
            id="promotionActive"
            type="checkbox"
        >



        <label>
            Start Date & Time
        </label>

        <input
            id="promotionStart"
            type="datetime-local"
        >



        <label>
            End Date & Time
        </label>

        <input
            id="promotionEnd"
            type="datetime-local"
        >



        <label>
            Qualifying Product
        </label>

        <select
            id="qualifyingProduct"
        >

            <option value="">
                Loading products...
            </option>

        </select>



        <label>
            Reward Product
        </label>

        <select
            id="rewardProduct"
        >

            <option value="">
                Loading products...
            </option>

        </select>



        <label>
            Reward Quantity
        </label>

        <input
            id="rewardQuantity"
            type="number"
            min="1"
            value="1"
        >



        <button
            id="savePromotion"
            type="button"
        >

            Save Promotion

        </button>



        <!-- ==============================================
             ADD PRODUCT
        =============================================== -->

        <h2>
            Add New Product
        </h2>


        <label>
            Product Name
        </label>

        <input
            id="newName"
            type="text"
            placeholder="Product Name"
        >


        <label>
            Price
        </label>

        <input
            id="newPrice"
            type="number"
            step="0.01"
            min="0"
            placeholder="Price"
        >


        <label>
            Stock Amount
        </label>

        <input
            id="newStock"
            type="number"
            min="0"
            placeholder="Stock Amount"
        >


        <label>
            Restock Date
        </label>

        <input
            id="newRestock"
            type="text"
            placeholder="Example: 8/15/2026"
        >


        <label>
            Image Filename
        </label>

        <input
            id="newImage"
            type="text"
            placeholder="Example: chips.png"
        >


        <button
            id="addProduct"
            type="button"
        >

            Add Product

        </button>



        <!-- ==============================================
             CURRENT PRODUCTS
        =============================================== -->

        <h2>
            Current Products
        </h2>


        <div id="adminProducts">

            <p>
                Loading products...
            </p>

        </div>



        <!-- ==============================================
             LOGOUT
        =============================================== -->

        <button
            id="logout"
            type="button"
        >

            Logout

        </button>


    </div>


</section>



<!-- ======================================================
     JAVASCRIPT
====================================================== -->

<script
    type="module"
    src="admin.js"
></script>


</body>

</html>
